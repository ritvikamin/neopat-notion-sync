name: NeoPAT Placement Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python
        run: |
          & "C:\Users\Lenovo\AppData\Local\Programs\Python\Python310\python.exe" --version
          & "C:\Users\Lenovo\AppData\Local\Programs\Python\Python310\python.exe" -m pip --version

      - name: Install dependencies
        run: |
          & "C:\Users\Lenovo\AppData\Local\Programs\Python\Python310\python.exe" -m pip install --upgrade pip
          & "C:\Users\Lenovo\AppData\Local\Programs\Python\Python310\python.exe" -m pip install -r requirements.txt

      - name: Run placement sync
        env:
          NEOPAT_REFRESH_TOKEN: ${{ secrets.NEOPAT_REFRESH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: |
          & "C:\Users\Lenovo\AppData\Local\Programs\Python\Python310\python.exe" -m app.sync